    tasks.register("launchTest") {
      description = "Check the J2S transpiled app opens in a Chrome browser."
      group = "swingjs-chrometest"
      /**
       * This task uses a ProcessBuilder to run Chrome, instead of using an Exec task.
       * In macOS the Chrome process doesn't time itself out as requested with --timeout, so an Exec task ends
       * up timing itself out and considering itself failed.
       * For non-macOS, the --virtual-time-budget and --timeoutWe work, but spotting the successString early
       * in a separate executor with recurring scheduled checks cannot end the task early even when throwing
       * an Exception.
       * Hence we are using a plain task and our own ProcessBuilder object for all OSes.
       */

      def chromeBinary = swingjs.chromeBinary.get()
      if (chromeBinary.startsWith("~/")) {
        chromeBinary = System.getProperty("user.home") + chromeBinary.substring(1)
      }

      def timeoutms = Integer.valueOf(20000) // in milliseconds

      def userDataDir = project.file(tasks.named("chromeProfile").get().chromeUserDir).getAbsolutePath()
      def stderrLaunchTestFile = project.file(tasks.named("copyStderrLaunchTestFile").get().stderrLaunchTestFile).getAbsolutePath()
      String[] commandLine = [
        "${chromeBinary}",
        "--no-sandbox",
        "--headless=new",
        "--disable-gpu",
        "--disable-save-password-bubble",
        "--disable-features=PasswordManager",
        "--use-mock-keychain", // needed for macOS
        "--timeout=${timeoutms}",
        "--virtual-time-budget=${timeoutms}",
        "--user-data-dir=${userDataDir}",
        "--profile-directory=${tasks.named('chromeProfile').get().profileName}",
        "--allow-file-access-from-files",
        "--enable-logging=stderr",
        "file://${stderrLaunchTestFile}"
      ]

      ProcessBuilder pb = new ProcessBuilder(commandLine)
      Process process = null
      BufferedReader reader

      def found = false
      def foundString = null
      def executor = Executors.newScheduledThreadPool(3);

      def successString = swingjs.chromeTestOutputString.get()
      def loggedSuccess = false

      doFirst {
        def binary = project.file(chromeBinary)
        if (!binary.exists()) {
          throw new StopExecutionException("Could not find Chrome binary '${chromeBinary}'. Cannot run task ${name}.")
        }

        logger.lifecycle("Running command: '" + styler["cyan"](commandLine.join(" ")) + "'")

        pb.redirectErrorStream(true)
        process = pb.start()
        reader = new BufferedReader(new InputStreamReader(process.getInputStream()))

        executor.scheduleWithFixedDelay(
          () -> {
            def line = null
            while( (line = reader.readLine()) != null ) {
              logger.info(line)
              if (line.contains(successString)) {
                found = true
                foundString = line
                break
              }
            }

            if (found) {
              logger.lifecycle("Found line with '${styler['green'](successString)}' in Chrome output.")
              loggedSuccess = true
              process.destroyForcibly()
              throw new StopActionException("Found string in Chrome output.")
            }
          },
          2000,
          1000,
          TimeUnit.MILLISECONDS
        )
        executor.schedule(
          () -> {
            process.destroyForcibly()
            if (found) {
              logger.lifecycle("Found line with '${styler['green'](successString)}' in Chrome output.")
              throw new StopActionException("Found string in Chrome output.")
            } else {
              throw new GradleException("Could not find evidence of J2S application launch in Chrome output.")
            }
            executor.shutdownNow()
          },
          timeoutms + 1000,
          TimeUnit.MILLISECONDS
        )
        logger.info("Waiting for up to "+(timeoutms+1000)+"ms")
        process.waitFor(timeoutms + 1000, TimeUnit.MILLISECONDS)
      }

      doLast {
        def line = null
        if (!found) {
          while( (line = reader.readLine()) != null ) {
            logger.info(line)
            if (line.contains(successString)) {
              found = true
              foundString = line
              break
            }
          }
        }
        if (process.isAlive()) {
          process.destroyForcibly()
        }
        executor.shutdownNow()
        if (found) {
          if (!loggedSuccess) {
            logger.lifecycle("Found line '${styler['green'](successString)}' in Chrome output.")
          }
          throw new StopActionException("Found string in output.")
        } else {
          logger.warn("Could not find '${styler['magenta'](successString)}' in Chrome output.")
          throw new GradleException("Could not find evidence of launch in Chrome output.")
        }
      }

      timeout = Duration.ofMillis(timeoutms + 8000)

      mustRunAfter("buildSite")
      dependsOn("chromeSetup")
    }
    
    tasks.register("transpileLaunchTest") {
      description = "Check the build's J2S transpilation opens in a Chrome browser."
      group = "swingjs-chrometest"
      
      dependsOn("buildSite")
      dependsOn("launchTest")
    }

    project.configurations {
      site
      siteTar
    }

    project.artifacts {
      add("site", tasks.named("buildSite"))
      add("siteTar", tasks.named("siteTar"))
    }


    /**
     * These IDE_* tasks are for running in Eclipse IDE GUI.  They are not required to develop the J2S application
     * in Eclipse but they should be useful.
     */

    tasks.register("IDE_checkJ2sPlugin") {
      description = "Compare the swingjs/net.sf.j2s.core-j11.jar file with the Eclipse IDE's plugin version (found in the 'dropins' dir)"
      group = "00 swingjs-IDE"

      doFirst {
        runInEclipse(name)

        def j2sPlugin = tasks.named("eclipseCopyDropins").get().j2sPluginJar
        def j2sPluginFile = project.file(j2sPlugin)
        def eclipseHome = System.properties["eclipse.home.location"]
        if (eclipseHome == null || ! inEclipseGui) {
          throw new StopExecutionException("Cannot find running Eclipse home from System.properties['eclipse.home.location']. Skipping task '${name}'.")
        }
        if (eclipseHome.startsWith("file:")) {
          URL eclipseHomeUrl = new URL(eclipseHome)
          eclipseHome = eclipseHomeUrl.getPath()
        }
        eclipseHome = eclipseHome.replaceAll(~/\/$/, "")
        def eclipseJ2sPluginDirs = [ "${eclipseHome}/dropins" ]
        def altPluginsDir = System.properties["org.eclipse.equinox.p2.reconciler.dropins.directory"]
        if (altPluginsDir != null && project.file(altPluginsDir).exists()) {
          eclipseJ2sPluginDirs += altPluginsDir
        }
        def foundPlugin = false
        def j2sPluginFileName = j2sPluginFile.getName()
        def eclipseJ2sPlugin
        def eclipseJ2sPluginFile
        eclipseJ2sPluginDirs.any { dir ->
          eclipseJ2sPlugin = "${dir}/${j2sPluginFileName}"
          eclipseJ2sPluginFile = project.file(eclipseJ2sPlugin)
          if (eclipseJ2sPluginFile.exists()) {
            foundPlugin = true
            return true
          }
        }
        if (!foundPlugin) {
          logger.warn("Eclipse IDE J2S Plugin is not installed -- could not find '${j2sPluginFileName}' in\n" + styler['cyan'](eclipseJ2sPluginDirs.join("\n")) + "\nTry running task IDE_copyJ2sPlugin")
          throw new StopExecutionException("Eclipse IDE J2S Plugin is not installed")
        }

        def digest = MessageDigest.getInstance("MD5")

        digest.update(j2sPluginFile.text.bytes)
        def j2sPluginMd5 = new BigInteger(1, digest.digest()).toString(16).padLeft(32, '0')

        digest.update(eclipseJ2sPluginFile.text.bytes)
        def eclipseJ2sPluginMd5 = new BigInteger(1, digest.digest()).toString(16).padLeft(32, '0')

        if (j2sPluginMd5 != eclipseJ2sPluginMd5) {
          logger.warn("WARNING! Eclipse J2S Plugin '${styler['magenta'](eclipseJ2sPlugin)}' is different to this branch's version '${styler['cyan'](j2sPlugin)}'")
          throw new StopExecutionException("Eclipse J2S Plugin is different to this branch's version.")
        } else {
          logger.lifecycle("Eclipse J2S Plugin '${styler['green'](eclipseJ2sPlugin)}' is the same as this branch's version '${styler['cyan'](j2sPlugin)}' (this is good)")
        }
      }
    }

    tasks.register("IDE_copyJ2sPlugin") {
      description = "Copies the java2script jar file into the Eclipse IDE 'dropins' directory"
      group = "00 swingjs-IDE"

      doFirst {
        runInEclipse(name)

        def j2sPlugin = tasks.named("eclipseCopyDropins").get().j2sPluginJar
        def j2sPluginFile = project.file(j2sPlugin)
        def eclipseHome = System.properties["eclipse.home.location"]
        if (eclipseHome == null || ! inEclipseGui) {
          throw new StopExecutionException("Cannot find running Eclipse home from System.properties['eclipse.home.location']. Skipping task '${name}'.")
        }
        if (eclipseHome.startsWith("file:")) {
          URL eclipseHomeUrl = new URL(eclipseHome)
          eclipseHome = eclipseHomeUrl.getPath()
        }
        eclipseHome = eclipseHome.replaceAll(~/\/$/, "")
        def eclipseJ2sDropinsPlugin = "${eclipseHome}/dropins/${j2sPluginFile.getName()}"
        def eclipseJ2sDropinsPluginFile = project.file(eclipseJ2sDropinsPlugin)

        logger.warn("${styler['magenta']('WARNING!')} Copying this branch's j2s plugin '${styler['cyan'](j2sPlugin)}'\nto this Eclipse IDE's dropins folder '${styler['cyan'](eclipseJ2sDropinsPlugin)}'\n${styler['magenta']('You may need to restart Eclipse IDE for this to take effect.')}")

        eclipseJ2sDropinsPluginFile.getParentFile().mkdirs()
        project.copy {
          from(j2sPluginFile)
          into(eclipseJ2sDropinsPluginFile.getParent())
        }
      }

      mustRunAfter("IDE_checkJ2sPlugin")
    }

    tasks.register("IDE_deleteJ2sPlugin") {
      description = "Deletes the java2script jar file in the Eclipse IDE 'dropins' directory.  Use with caution."
      group = "00 swingjs-IDE"

      doFirst {
        runInEclipse(name)

        def j2sPlugin = tasks.named("eclipseCopyDropins").get().j2sPluginJar
        def j2sPluginFile = project.file(j2sPlugin)
        def j2sPluginFilename = j2sPluginFile.getName()
        def eclipseHome = System.properties["eclipse.home.location"]
        if (eclipseHome == null || ! inEclipseGui) {
          throw new StopExecutionException("Cannot find running Eclipse home from System.properties['eclipse.home.location']. Skipping task '${name}'.")
        }
        if (eclipseHome.startsWith("file:")) {
          URL eclipseHomeUrl = new URL(eclipseHome)
          eclipseHome = eclipseHomeUrl.getPath()
        }
        eclipseHome = eclipseHome.replaceAll(~/\/$/, "")
        def eclipseJ2sDropinsPlugin = "${eclipseHome}/dropins/${j2sPluginFile.getName()}"
        def eclipseJ2sDropinsPluginFile = project.file(eclipseJ2sDropinsPlugin)

        if (eclipseJ2sDropinsPluginFile.exists()) {
          logger.warn("${styler['magenta']('WARNING!')} Deleting the j2s plugin '${styler['cyan'](eclipseJ2sDropinsPlugin)}'\nfrom this Eclipse IDE's dropins folder '${styler['cyan'](eclipseJ2sDropinsPluginFile.getParent())}'\n${styler['magenta']('You may need to restart Eclipse IDE for this to take effect.')}")
          eclipseJ2sDropinsPluginFile.delete()
        } else {
          logger.warn("Could not find the j2s plugin jar file (${styler['magenta'](eclipseJ2sDropinsPluginFile.getName())}) in this Eclipse IDE's dropins folder (${styler['cyan'](eclipseJ2sDropinsPluginFile.getParent())}).")
        }
      }
    }

    tasks.register("IDE_createJ2sFile") {
      description = "Create the default .j2s file *in the target project* enabling the alternative J2S Config file for headless (or IDE GUI) build by adding the ${j2sAltJ2sFilePropertyName} property (and the ${j2sSiteDirProperty} and ${j2sTemplateHtmlProperty} properties) to the default .j2s file"
      group = "00 swingjs-IDE"

      doFirst {
        runInEclipse(name)
      }

      dependsOn("createJ2sFile")
    }

    tasks.register("IDE_copyCores") {
      description = "Build the core js lib closures listed in the classlists dir and publish core html from template"
      group = "00 swingjs-IDE"

      doFirst {
        runInEclipse(name)
      }

      dependsOn("copyCores")
      dependsOn("copyCoreTemplates")
    }
	
    tasks.register("IDE_copySwingJS") {
      description = "Copy SwingJS libs and resources to site dir"
      group = "00 swingjs-IDE"

      doFirst {
        runInEclipse(name)
      }

      dependsOn("copySwingJs")
    }

    tasks.register("IDE_prepareSite") {
      description = "Copy all libs and resources to site dir, except for closure cores"
      group = "00 swingjs-IDE"

      doFirst {
        runInEclipse(name)
      }

      //dependsOn("copyAppResources") // these should be copied by the net.sf.j2s.core-j11.jar plugin
      dependsOn("prepareSite")
    }

    tasks.register("IDE_siteClean") {
      description = "Deletes the Eclipse and J2S transpiled site"
      group = "00 swingjs-IDE"

      doFirst {
        runInEclipse(name)
      }

      dependsOn("cleanSite")
    }

    tasks.register("IDE_launchTest") {
      description = "Runs the Chrome launch test independently of Eclipse IDE"
      group = "00 swingjs-IDE"

      doFirst {
        runInEclipse(name)
      }

      dependsOn("launchTest")
    }

    tasks.register("IDE_00_Setup_Eclipse") {
      description = "Run the tasks needed to use this Eclipse IDE with SwingJSPlugin.  May require a restart to take effect."
      group = "00 swingjs-IDE"

      doFirst {
        runInEclipse(name)
      }

      dependsOn("IDE_copyJ2sPlugin")
      dependsOn("createJ2sFile")
      dependsOn("IDE_prepareSite")
    }

    /**
     * Set
     *   eclipse {
     *     synchronizationTasks("${project.path}:eclipseSynchronizationTask")
     *     autoBuildTasks("${project.path}:eclipseAutoBuildTask")
     *   }
     * in the target project's build.gradle (where project.path is the gradle path to the project
     * with this plugin applied.
     * synchronizationTasks run when that project is imported or refreshed.
     * autoBuildTasks run every time a source or resource is updated (when Eclipse builds).
     * NOTE that autoBuildTasks does not seem to run after a "Project -> Clean...", so a Refresh
     * is required.
     */
    // buildship runs this at project import or refresh, if it's registered
    tasks.register("eclipseSynchronizationTask") {
      description = "A task to set in the eclipse { synchronizationTasks( ... ) } extension block"
      group = "00 swingjs-IDE"

      doFirst {
        runInEclipse(name)
        logger.lifecycle("Task ${styler['green'](path)} is executing")
      }

      dependsOn("IDE_checkJ2sPlugin")
      dependsOn("createJ2sFile")
      dependsOn("IDE_prepareSite")
    }

    // buildship runs this at build time (e.g. resource file save), if it's registered
    tasks.register("eclipseAutoBuildTask") {
      description = "A task to set in the eclipse { autoBuildTasks( ... ) } extension block"
      group = "00 swingjs-IDE"

      doFirst {
        runInEclipse(name)
        logger.lifecycle("Task ${styler['green'](path)} is executing")
      }

      dependsOn("copySwingJs")
    }
  }
}

apply plugin: SwingJSPlugin
