/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'java-library'
    id 'maven-publish'
	id 'jacoco'
	id("com.diffplug.spotless") version "8.3.0"
}

repositories {
    mavenLocal()
    maven {
        url = uri('https://repo.maven.apache.org/maven2/')
    }
}

dependencies {
    api libs.org.apache.httpcomponents.httpclient
    api libs.org.apache.httpcomponents.httpcore
    api libs.org.apache.httpcomponents.httpmime
    api libs.commons.logging.commons.logging
    api libs.org.json.json
	
	testImplementation("junit:junit:4.13.2")
	testImplementation("org.testng:testng:7.12.0")
	testImplementation("io.github.classgraph:classgraph:4.8.184")
	testImplementation("org.hamcrest:hamcrest:3.0")
	testImplementation("org.mockito:mockito-core:5.22.0")
  
}

group = 'uk.ac.dundee.compbio'
version = '0.0.1-SNAPSHOT'
description = 'A Java Client for Slivka Services'
java.sourceCompatibility = JavaVersion.VERSION_11

//sourceSets {
//	main.java {}
//	test {
//		java {}
//		resources {
//			srcDirs("resources")
//		}
//	}
//}

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useTestNG() {
	    preserveOrder = true
		useDefaultListeners = true
	}
}


/**
 * Spotless code style
 */

spotless {
  // only apply to files changed since branching from this branch
  // Commenting out as Eclipse complains if you don't have this branch.
  // TODO put back in when devlopment/Release_2_12_Branch has these changes (and delete this comment)
  //ratchetFrom("development/Release_2_12_Branch")

  java {
	importOrder("java", "javax", "org", "com", "jalview", "\\#" )
	removeUnusedImports()
	eclipse().configFile("resources/eclipse/JalviewCodeStyle.xml")
  }
}

