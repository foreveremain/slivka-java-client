plugins {
  // repository for auto-downloading required JDK
  id("org.gradle.toolchains.foojay-resolver-convention") version "1.0.0"
}

rootProject.name = 'slivkaclient'
 
dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
  repositories {
    mavenCentral()
    gradlePluginPortal()
    mavenLocal()
    maven {
      url = uri('https://maven.ej-technologies.com/repository')
    }
    maven {
      url = uri("https://maven.hello2morrow.com/repository/")
    }
  }
}

include(":slivka-javajs-client")

include(":download-eclipse")
include(":download-chrome")
